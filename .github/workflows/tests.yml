name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Abhängigkeiten
        run: |
          pip install playwright jinja2 pillow
          python -m playwright install --with-deps chromium
      - name: Tests
        run: python tests/run_tests.py
